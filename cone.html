        return (rs||[]).map(r=>({
          bay:String(r.bay||''), row:String(r.row||'').padStart(2,'0'),
          tier:String(r.tier||'').padStart(2,'0'), iso:String(r.iso||''), cn:String(r.cn||''),
        }));
      };
      if(state.disch&&state.disch.ediRows&&state.disch.ediRows.length) gridD=window.ConeBayGrid.buildGrid(toMaster(state.disch), shipInfo);
      if(state.stow&&state.stow.ediRows&&state.stow.ediRows.length) gridL=window.ConeBayGrid.buildGrid(toMaster(state.stow), shipInfo);
    }catch(err){
      console.warn('[ConeOne 1.2] 격자 모듈 실패 — 간이 격자 폴백', err);
      gridD=null; gridL=null;
    }
  }
  const masterGrid = !!(gridD||gridL);

  const existBays=new Set(allRows.map(x=>x.b));
  for(const bn of dictBays.keys()) existBays.add(bn);
  // 그룹키: 짝수 e → e(페어 대표). 홀수 o → 앞 짝수(o-1) 있으면 o-1, 없으면 o(단독).
  const groupKeyOf=(b)=> b%2===0 ? b : (existBays.has(b-1)?b-1:b);

  const bays={};          // groupKey → 'row_tier' → {d,l,row,tier}
  const groupBays={};     // groupKey → Set(실제 베이번호) — 제목 표기용
  for(const {r,flag,b} of allRows){
    const gk=groupKeyOf(b);
    if(!bays[gk]) bays[gk]={};
    if(!groupBays[gk]) groupBays[gk]=new Set();
    groupBays[gk].add(b);
    const key=r.row+'_'+String(r.tier).padStart(2,'0');
    if(!bays[gk][key]) bays[gk][key]={row:r.row,tier:String(r.tier).padStart(2,'0')};
    bays[gk][key][flag]=r;
  }

  const bayKeys=Object.keys(bays).map(Number).sort((a,b)=>a-b);
  if(!bayKeys.length){ ra.innerHTML='<div class="card"><div class="empty-note">표시할 컨테이너가 없습니다.</div></div>'; return; }

  // 콘 개수 계산 (그룹키 = 베이플랜 그룹키와 동일: 짝수=페어, 단독 홀수)
  //   → 베이별 상단에 필요 콘 수 표기. 양하(현재 배치)·선적(실어야 할) 각각.
  let coneByGroup={};
  let coneTotal={ disch:{deck:0,ele:0,hold:0}, stow:{deck:0,ele:0,hold:0} };  // 전체 총 콘 개수
  try{
    const __ctx=buildConeCtx(dictBays);
    const sg=planToGroups(state.stow, __ctx), dg=planToGroups(state.disch, __ctx);
    for(const k of new Set([...Object.keys(sg||{}),...Object.keys(dg||{})].map(Number))){
      const s=sg[k]||{deck:0,ele:0,hold:0}, d=dg[k]||{deck:0,ele:0,hold:0};
      coneByGroup[k]={
        stow:{deck:s.deck,ele:s.ele,hold:s.hold},     // 총개수
        disch:{deck:d.deck,ele:d.ele,hold:d.hold},
      };
      // 총개수(콘 박스에서 가져올 수량): 원본 콘 수 그대로 합산
      coneTotal.stow.deck+=s.deck; coneTotal.stow.ele+=s.ele; coneTotal.stow.hold+=s.hold;
      coneTotal.disch.deck+=d.deck; coneTotal.disch.ele+=d.ele; coneTotal.disch.hold+=d.hold;
    }
  }catch(e){ coneByGroup={}; }

  const hasD=!!(state.disch&&state.disch.ediRows&&state.disch.ediRows.length);
  const hasL=!!(state.stow&&state.stow.ediRows&&state.stow.ediRows.length);
  const shipLabel=state.shipName||'선박';
  const today=new Date().toLocaleDateString('ko-KR');

  // 평택분 판정 (양하=pod 평택, 선적=pol 평택). 메인 isPtkPort()와 동일 기준. V7.28 통일.
  const isPtk=(c,flag)=> !!c && isPtkPort(flag==='d'?c.pod:c.pol);
  // 특수타입 라벨/심볼
  const special=(c)=>{
    if(!c) return null;
    if(c.dg) return {sym:'⚠',label:'DG',cls:'sp-dg'};
    if(c.reefer) return {sym:'❄',label:(c.temp!=null?(c.temp+'°'):'RF'),cls:'sp-rf'};
    if(c.fr) return {sym:'▭',label:'FR',cls:'sp-fr'};
    if(c.tk) return {sym:'▣',label:'TK',cls:'sp-tk'};
    if(c.ot||c.oog) return {sym:'△',label:'OT',cls:'sp-ot'};
    return null;
  };
  // 셀 색 클래스
  const cellCls=(c,flag)=>{
    const sp=special(c);
    if(sp) return 'bvc '+sp.cls;
    if(isPtk(c,flag)) return 'bvc '+(flag==='d'?'ptk-d':'ptk-l');  // 평택분 강조
    return 'bvc '+(flag==='d'?'oth-d':'oth-l');                    // 통과/타항
  };
  // POL/POD 짧게 (뒤 3자)
  const short=p=>{ p=String(p||'').toUpperCase(); return p.length>=5?p.slice(2,5):p; };

  // ConeOne 1.2: 격자 모듈 실패 시 명시 경고 — 간이 해석 모드 경고 카드와 같은 패턴(조용한 격하 금지)
  const gridWarnHtml = masterGrid ? '' :
    '<div class="card" style="border-color:var(--accent)"><p style="margin:0;font-size:13px;line-height:1.6;color:var(--accent)">⚠ 간이 격자 모드 — 신호가 약해 본체 격자 모듈을 내려받지 못했습니다. 실제 선박에 없는 빈 칸(점선)이 보일 수 있습니다. 신호가 잡히면 작업을 다시 선택해 주세요.</p></div>';
  let html=resultTabsHtml('bay')+parserWarnHtml()+gridWarnHtml+`<div class="card">
    <div class="share-head"><div class="sh-title">베이플랜 (양하·선적 비교)</div>
      <div class="sh-sub">${shipLabel} · ${today}</div></div>
    <div class="bv-zoom">
      <button class="bv-zb" id="bvRotate" style="width:auto;padding:0 12px;white-space:nowrap;background:var(--panel2);">⟳ 가로모드</button>
      <span>크기</span>
      <button class="bv-zb" id="bvZoomOut">－</button>
      <input type="range" id="bvZoomRange" min="10" max="100" value="100" step="5">
      <button class="bv-zb" id="bvZoomIn">＋</button>
      <span id="bvZoomPct">100%</span>
    </div>
    <div class="bv-legend">
      <span class="bv-lg ptkd">양하 평택</span>
      <span class="bv-lg ptkl">선적 평택</span>
      <span class="bv-lg rf">❄리퍼</span>
      <span class="bv-lg dg">⚠위험물</span>
      <span class="bv-lg" style="color:var(--dim)">★평택분</span>
    </div>`;

  // 전체 총 콘 개수 (콘 박스에서 한 번에 가져올 수량) + 곳 수
  const totalLine=(o,label,cls)=>{
    const segs=[];
    if(o.deck) segs.push('데크콘 총 '+o.deck+'개 ('+Math.round(o.deck/4)+'곳 ×4)');
    if(o.ele)  segs.push('코끼리콘 총 '+o.ele+'개 ('+Math.round(o.ele/2)+'곳 ×2)');
    if(o.hold) segs.push('홀드콘 총 '+o.hold+'개');
    return segs.length? `<div class="bv-total ${cls}"><b>${label}</b><br>${segs.join('<br>')}</div>` : '';
  };
  let totalBox='';
  if(hasD) totalBox+=totalLine(coneTotal.disch,'양하 총콘','tot-d');
  if(hasL) totalBox+=totalLine(coneTotal.stow,'선적 총콘','tot-l');
  // 전체 가감 (선적 - 양하)
  if(hasD&&hasL){
    const diff=(k)=>coneTotal.stow[k]-coneTotal.disch[k];
    const dd=diff('deck'), de=diff('ele'), dh=diff('hold');
    const fmt=(v,lbl)=> v===0?'':(lbl+' '+(v>0?'+'+v:v)+'개');
    const seg=[fmt(dd,'데크콘'),fmt(de,'코끼리콘'),fmt(dh,'홀드콘')].filter(Boolean);
    if(seg.length) totalBox+=`<div class="bv-total tot-diff"><b>가감 (콘 박스 기준)</b><br>${seg.join('<br>')}</div>`;
  }
  if(totalBox) html+=`<div class="bv-totals">${totalBox}</div>`;

  html+=`<div class="bv-zoomwrap" id="bvZoomWrap"><div class="bv-zoomarea" id="bvZoomArea">`;

  // ═══ ConeOne 1.2: 검수앱 격자(ConeBayGrid) 기반 렌더 — 격자 모듈이 있을 때의 기본 경로 ═══
  //   격자의 칸만 그린다. 존재하지 않는 칸은 .bv-slot.none(안 그림), 40ft 그림자는 .bv-x(×).
  if(masterGrid){
    // 컨테이너 셀 — 기존 boxCell과 동일 모양 (폴백 경로와 독립 유지를 위해 복제)
    const boxCellM=(c,flag)=>{
      const ct=c[flag];
      if(!ct) return '<td class="bv-slot off"></td>';
      const sp=special(ct);
      const ptk=isPtk(ct,flag);
      const fe=ct.fe==='E'?'E':(ct.fe==='F'?'F':'');
      const pol=short(ct.pol), pod=short(ct.pod);
      const line3 = sp ? sp.label : (ct.size+'ft '+fe);
      return `<td class="${cellCls(ct,flag)}" title="${ct.cn||''} row ${c.row} tier ${c.tier}">`
        +`<div class="bvc-in">`
        +`<div class="bvc-pp">${pol||'·'}/<b>${pod||'·'}</b>${ptk?'<span class="bvc-star">★</span>':''}</div>`
        +`<div class="bvc-cn">${ct.cn?`<span class="bvc-cnh">${ct.cn.slice(0,-4)}</span><b class="bvc-cn4">${ct.cn.slice(-4)}</b>`:'—'}</div>`
        +`<div class="bvc-l3">${sp?sp.sym+' ':''}${line3}</div>`
        +`</div></td>`;
    };
    // 베이별 컨테이너 맵 (표시 대상은 기존과 동일 — ediRows)
    const bayCont={};
    for(const {r,flag,b} of allRows){
      const m=(bayCont[b]=bayCont[b]||{});
      const rw=String(r.row||'').padStart(2,'0'), tr=String(r.tier||'').padStart(2,'0');
      const key=rw+'_'+tr;
      if(!m[key]) m[key]={row:rw,tier:tr};
      m[key][flag]=r;
    }
    // 페이지 합본 — 양하/선적 각자의 격자 (검수앱 모드별 베이플랜과 동일). 키 = 짝수 대표/단독 홀수.
    const pmap=new Map();
    const addAll=(g,flag)=>{ if(!g||!g.pages) return; for(const p of g.pages){
      const gk=parseInt(p.evenBay!=null?p.evenBay:p.oddBay,10);
      const e=pmap.get(gk)||{gk}; e[flag]=p; pmap.set(gk,e);
    }};
    addAll(gridD,'d'); addAll(gridL,'l');
    const plist=[...pmap.values()].sort((a,b)=>a.gk-b.gk);
    const CELL_PITCH=60;   // .bv-tab.box td 58px + border-spacing 2px
    for(const pe of plist){
      const ref=pe.d||pe.l;
      const members=new Set();
      [pe.d,pe.l].forEach(p=>{ if(!p) return; if(p.evenBay!=null) members.add(parseInt(p.evenBay,10)); if(p.oddBay!=null) members.add(parseInt(p.oddBay,10)); });
      const cells={};
      for(const mb of members){
        const m=bayCont[mb]; if(!m) continue;
        for(const k in m){
          if(!cells[k]) cells[k]={row:m[k].row,tier:m[k].tier};
          if(m[k].d) cells[k].d=m[k].d;
          if(m[k].l) cells[k].l=m[k].l;
        }
      }
      const cnt={d:0,l:0};
      Object.values(cells).forEach(c=>{ if(c.d)cnt.d++; if(c.l)cnt.l++; });
      // 섹션 그리드 — coord(칸 단위)·flex(직사각 골격, 검수앱 폴백과 동일)
      const secGrid=(pg,sec,flag)=>{
        const xset=new Set(pg.xMarks||[]);
        const cellTd=(row,tier2)=>{
          const c=cells[row+'_'+tier2];
          if(c&&c[flag]) return boxCellM(c,flag);
          if(c&&(c.d||c.l)) return '<td class="bv-slot off"></td>';
          if(xset.has(row+'-'+tier2)) return '<td class="bv-x" title="인접 40ft 점유(그림자)">×</td>';
          return '<td class="bv-slot"></td>';
        };
        if(pg.mode==='coord'){
          const axis=sec==='deck'?pg.deckAxis:pg.holdAxis;
          const rows=sec==='deck'?pg.deckRows:pg.holdRows;
          if(!(axis&&axis.length)||!(rows&&rows.length)) return '';
          const off=sec==='deck'?pg.deckOff:pg.holdOff;
          const mg=Math.round((off||0)*CELL_PITCH);
          let head='<tr><td class="bv-tl"></td>';
          for(const r of axis) head+=`<td class="bv-rl">${r}</td>`;
          head+='</tr>';
          let g=`<table class="bv-tab box" style="margin-left:${mg}px"><tbody>`+head;
          for(const tr of rows){
            const has=new Set(tr.rows);
            g+=`<tr><td class="bv-tl">${tr.tier}</td>`;
            for(const r of axis){
              if(!has.has(r)){ g+='<td class="bv-slot none"></td>'; continue; }   // 검수앱에 없는 칸 — 안 그림
              g+=cellTd(r,tr.tier);
            }
            g+='</tr>';
          }
          g+='</tbody></table>';
          return g;
        }
        const tiers=sec==='deck'?pg.deckTiersPadded:pg.holdTiersPadded;
        const rowsArr=sec==='deck'?pg.deckRowsArr:pg.holdRowsArr;
        const realTiers=(tiers||[]).filter(Boolean);
        if(!realTiers.length||!(rowsArr&&rowsArr.length)) return '';
        let head='<tr><td class="bv-tl"></td>';
        for(const r of rowsArr) head+=`<td class="bv-rl">${r||''}</td>`;
        head+='</tr>';
        let g='<table class="bv-tab box"><tbody>'+head;
        for(const t of realTiers){
          const t2=String(t).padStart(2,'0');
          g+=`<tr><td class="bv-tl">${t2}</td>`;
          for(const r of rowsArr){
            if(!r){ g+='<td class="bv-slot none"></td>'; continue; }
            g+=cellTd(r,t2);
          }
          g+='</tr>';
        }
        g+='</tbody></table>';
        return g;
      };
      const panelM=(flag,label,count)=>{
        const pg=flag==='d'?pe.d:pe.l;
        let p=`<div class="bv-col"><div class="bv-colhd ${flag}">${label} <span class="bv-cnt">${count}대</span></div>`;
        if(!pg){ p+='<div class="empty-note" style="padding:8px 4px">이 작업에는 해당 베이가 없습니다</div></div>'; return p; }
        const dHtml=secGrid(pg,'deck',flag), hHtml=secGrid(pg,'hold',flag);
        if(dHtml) p+=`<div class="bv-sec">갑판</div>${dHtml}`;
        if(hHtml) p+=`<div class="bv-sec">선창</div>${hHtml}`;
        p+='</div>';
        return p;
      };
      // 콘 개수 배지 — 콘 계산 그룹키(짝수 대표/단독 홀수)와 대응. 단독 홀수는 앞 짝수 키도 시도.
      const cone=coneByGroup[pe.gk]!==undefined ? coneByGroup[pe.gk]
        : ((pe.gk%2===1 && coneByGroup[pe.gk-1]!==undefined) ? coneByGroup[pe.gk-1] : undefined);
      let coneBadge='';
      if(cone){
        const spots=(o)=>({ deck:Math.round(o.deck/4), ele:Math.round(o.ele/2), hold:o.hold });
        const part=(o,lbl,cls)=>{
          const sp=spots(o);
          const segs=[];
          if(o.deck) segs.push('데크콘 '+o.deck+'개('+sp.deck+'곳)');
          if(o.ele)  segs.push('코끼리콘 '+o.ele+'개('+sp.ele+'곳)');
          if(o.hold) segs.push('홀드콘 '+o.hold+'개');
          return segs.length? `<span class="bv-cone ${cls}">${lbl} ${segs.join(' · ')}</span>` : '';
        };
        const d=part(cone.disch,'양하콘','cone-d'), s=part(cone.stow,'선적콘','cone-l');
        let diffStr='';
        if(hasD&&hasL){
          const diff=(k)=>cone.stow[k]-cone.disch[k];
          const dd=diff('deck'), de=diff('ele'), dh=diff('hold');
          const seg=[];
          const fmt=(v,lbl)=> v===0?'':(lbl+' '+(v>0?'+'+v:v));
          [fmt(dd,'데크콘'),fmt(de,'코끼리콘'),fmt(dh,'홀드콘')].forEach(x=>{ if(x) seg.push(x); });
          if(seg.length) diffStr=`<span class="bv-cone cone-diff">가감 ${seg.join(' · ')}</span>`;
        }
        if(d||s||diffStr) coneBadge=`<div class="bv-cones">${d}${s}${diffStr}</div>`;
      }
      html+=`<div class="bv-bay"><div class="bv-bayhd">${ref.title}</div>
        ${coneBadge}
        <div class="bv-split">`;
      if(hasD) html+=panelM('d','양하',cnt.d);
      if(hasL) html+=panelM('l','선적',cnt.l);
      html+='</div></div>';
    }
  } else {
  // ═══ 폴백(간이 격자 모드): 기존 콘앱 방식 — 격자 모듈을 못 받았을 때만 ═══
  // V7.52: 베이 골격 계산 함수 (사전 → 실데이터 합집합 → EDI 폴백 연속 보간)
  const computeSkel=(cells, memberBays)=>{
    let sk=null;
    for(const mb of memberBays){
      const s=bvBaySkeleton(dictBays.get(mb));
      if(!s) continue;
      if(!sk){ sk={deckTiers:[...s.deckTiers],holdTiers:[...s.holdTiers],deckRowPos:[...s.deckRowPos],holdRowPos:[...s.holdRowPos]}; }
      else {
        sk.deckTiers=[...new Set([...sk.deckTiers,...s.deckTiers])];
        sk.holdTiers=[...new Set([...sk.holdTiers,...s.holdTiers])];
        if(s.deckRowPos.length>sk.deckRowPos.length) sk.deckRowPos=[...s.deckRowPos];
        if(s.holdRowPos.length>sk.holdRowPos.length) sk.holdRowPos=[...s.holdRowPos];
      }
    }
    let deckTiers, holdTiers, deckRowPos, holdRowPos;
    if(sk && (sk.deckTiers.length||sk.holdTiers.length)){
      deckTiers=sk.deckTiers.slice(); holdTiers=sk.holdTiers.slice();
      deckRowPos=sk.deckRowPos.slice(); holdRowPos=sk.holdRowPos.slice();
      // 실제 컨테이너 tier/row를 골격에 합집합 (베이사전이 실데이터보다 좁아도 누락 방지)
      const realDeckRows=new Set(deckRowPos), realHoldRows=new Set(holdRowPos);
      const realDeckTiers=new Set(deckTiers), realHoldTiers=new Set(holdTiers);
      for(const c of Object.values(cells)){
        const t=parseInt(c.tier,10);
        if(t>=80){ realDeckTiers.add(t); realDeckRows.add(c.row); }
        else { realHoldTiers.add(t); realHoldRows.add(c.row); }
      }
      const sortRows=set=>{
        const arr=[...set];
        const ev=arr.filter(r=>parseInt(r,10)%2===0&&r!=='00').sort((a,b)=>parseInt(b)-parseInt(a));
        const ze=arr.filter(r=>r==='00');
        const od=arr.filter(r=>parseInt(r,10)%2===1).sort((a,b)=>parseInt(a)-parseInt(b));
        return [...ev,...ze,...od];
      };
      deckTiers=[...realDeckTiers].sort((a,b)=>b-a);
      holdTiers=[...realHoldTiers].sort((a,b)=>b-a);
      deckRowPos=sortRows(realDeckRows);
      holdRowPos=sortRows(realHoldRows);
    } else {
      // 폴백: 컨테이너로 추정 — 데크/홀드 각자 수집 + 보인 범위 내 연속 보간 (V7.50~51)
      const buildRows=(rset)=>{
        const nums=[...rset].map(r=>parseInt(r,10));
        if(!nums.length) return [];
        const evs=nums.filter(v=>v>0&&v%2===0), ods=nums.filter(v=>v%2===1);
        const out=[];
        if(evs.length) for(let v=Math.max(...evs); v>=2; v-=2) out.push(String(v).padStart(2,'0'));
        if(rset.has('00')) out.push('00');
        if(ods.length) for(let v=1; v<=Math.max(...ods); v+=2) out.push(String(v).padStart(2,'0'));
        return out;
      };
      const buildTiers=(tset, base)=>{
        if(!tset.size) return [];
        const out=[]; for(let t=Math.max(...tset); t>=base; t-=2) out.push(t);
        return out;
      };
      const dT=new Set(), hT=new Set(), dR=new Set(), hR=new Set();
      for(const c of Object.values(cells)){
        const t=parseInt(c.tier,10);
        if(t>=80){ dT.add(t); dR.add(c.row); }
        else { hT.add(t); hR.add(c.row); }
      }
      deckTiers=buildTiers(dT, dT.size?Math.min(82, Math.min(...dT)):82);
      holdTiers=buildTiers(hT, hT.size?Math.min(2, Math.min(...hT)):2);
      deckRowPos=buildRows(dR); holdRowPos=buildRows(hR);
    }
    return {deckTiers, holdTiers, deckRowPos, holdRowPos};
  };

  // V7.52: 1패스 — 전 베이 골격·전체 최대 폭 (베이 간 정렬 기준, 사용자 확정).
  //   deck-only 베이(예: BAY 01, 4칸)도 전체 최대 폭(예: 6칸) 기준 0.5칸 단위로
  //   들여쓰기 → 04 열이 어느 베이에서나 같은 세로선 (지침 4.4의 베이 간 확장).
  const skels={};
  let globalMaxW=1;
  for(const bk of bayKeys){
    const s=computeSkel(bays[bk], [...(groupBays[bk]||[bk])].sort((a,b)=>a-b));
    skels[bk]=s;
    globalMaxW=Math.max(globalMaxW, s.deckRowPos.length, s.holdRowPos.length);
  }

  for(const bk of bayKeys){
    const cells=bays[bk];
    const memberBays=[...(groupBays[bk]||[bk])].sort((a,b)=>a-b);
    const {deckTiers, holdTiers, deckRowPos, holdRowPos}=skels[bk];

    // 중앙정렬 = 지침 4.4 "1칸 차이 → 좌우 0.5칸씩". 기준 폭 = 전체 베이 최대(globalMaxW)
    //   — 베이 내부(데크↔홀드)와 베이 간(위아래 박스) 정렬을 같은 공식으로.
    const CELL_PITCH=60;
    const centerMargin=(n)=> Math.round((globalMaxW-n)*CELL_PITCH/2);
    const deckMg=centerMargin(deckRowPos.length), holdMg=centerMargin(holdRowPos.length);

    const cnt={d:0,l:0};
    Object.values(cells).forEach(c=>{ if(c.d)cnt.d++; if(c.l)cnt.l++; });

    // 한 칸(컨테이너 박스) — 검수앱 셀 모양: POL/POD, 컨번호, F/E·온도, 평택★
    const boxCell=(c,flag)=>{
      const ct=c[flag];
      if(!ct) return '<td class="bv-slot off"></td>';
      const sp=special(ct);
      const ptk=isPtk(ct,flag);
      const fe=ct.fe==='E'?'E':(ct.fe==='F'?'F':'');
      const pol=short(ct.pol), pod=short(ct.pod);
      const cn=(ct.cn||'').slice(0,4)+(ct.cn?'<br>'+(ct.cn||'').slice(4):''); // 2줄
      const line3 = sp ? sp.label : (ct.size+'ft '+fe);
      return `<td class="${cellCls(ct,flag)}" title="${ct.cn||''} row ${c.row} tier ${c.tier}">`
        +`<div class="bvc-in">`
        +`<div class="bvc-pp">${pol||'·'}/<b>${pod||'·'}</b>${ptk?'<span class="bvc-star">★</span>':''}</div>`
        +`<div class="bvc-cn">${ct.cn?`<span class="bvc-cnh">${ct.cn.slice(0,-4)}</span><b class="bvc-cn4">${ct.cn.slice(-4)}</b>`:'—'}</div>`
        +`<div class="bvc-l3">${sp?sp.sym+' ':''}${line3}</div>`
        +`</div></td>`;
    };

    const grid=(tierList, flag, rowPos, mg)=>{
      if(!tierList.length || !rowPos.length) return '';
      let head='<tr><td class="bv-tl"></td>';
      for(const r of rowPos) head+=`<td class="bv-rl">${r}</td>`;
      head+='</tr>';
      let g=`<table class="bv-tab box" style="margin-left:${mg||0}px"><tbody>`+head;
      for(const t of tierList){
        const tk=String(t).padStart(2,'0');
        g+=`<tr><td class="bv-tl">${tk}</td>`;
        for(const r of rowPos){
          const c=cells[r+'_'+tk];
          if(!c){ g+='<td class="bv-slot"></td>'; continue; }  // 자리 있음·컨테이너 없음 = 점선 (자리는 항상 표시)
          g+=boxCell(c,flag);
        }
        g+='</tr>';
      }
      g+='</tbody></table>';
      return g;
    };
    // V7.51: 모든 단·모든 자리 표시 (사용자 확정 — "컨테이너가 없다고 자리가 없는 것이 아니다.
    //   어느 한 곳도 그냥 지나쳐선 안 된다"). V7.49의 단(tier) 생략 철회.
    //   빈 자리는 점선 슬롯으로 항상 보임. 구역 자체가 골격에 없을 때만 한 줄 안내.
    const panel=(flag,label,count)=>{
      let p=`<div class="bv-col"><div class="bv-colhd ${flag}">${label} <span class="bv-cnt">${count}대</span></div>`;
      if(deckTiers.length){ p+=`<div class="bv-sec">갑판</div>${grid(deckTiers,flag,deckRowPos,deckMg)}`; }
      if(holdTiers.length){ p+=`<div class="bv-sec">선창</div>${grid(holdTiers,flag,holdRowPos,holdMg)}`; }
      p+='</div>';
      return p;
    };

    const bayTitle = memberBays.length>1
      ? String(memberBays[0]).padStart(2,'0')+'-'+String(memberBays[memberBays.length-1]).padStart(2,'0')
      : String(memberBays[0]).padStart(2,'0');
    // 콘 개수 배지 (이 그룹)
    const cone=coneByGroup[bk];
    let coneBadge='';
    if(cone){
      // 곳 수: 데크콘 ÷4, 코끼리콘 ÷2, 홀드콘은 받침 대수(곳)와 동일하지 않으니 개수만
      const spots=(o)=>({ deck:Math.round(o.deck/4), ele:Math.round(o.ele/2), hold:o.hold });
      const part=(o,lbl,cls)=>{
        const sp=spots(o);
        const segs=[];
        if(o.deck) segs.push('데크콘 '+o.deck+'개('+sp.deck+'곳)');
        if(o.ele)  segs.push('코끼리콘 '+o.ele+'개('+sp.ele+'곳)');
        if(o.hold) segs.push('홀드콘 '+o.hold+'개');
        return segs.length? `<span class="bv-cone ${cls}">${lbl} ${segs.join(' · ')}</span>` : '';
      };
      const d=part(cone.disch,'양하콘','cone-d'), s=part(cone.stow,'선적콘','cone-l');
      // 가감: 양하·선적 둘 다 있을 때 차이 (선적 - 양하: +면 추가, -면 반납)
      let diffStr='';
      if((hasD&&hasL)){
        const diff=(k)=>cone.stow[k]-cone.disch[k];
        const dd=diff('deck'), de=diff('ele'), dh=diff('hold');
        const seg=[];
        const fmt=(v,lbl)=> v===0?'':(lbl+' '+(v>0?'+'+v:v));
        [fmt(dd,'데크콘'),fmt(de,'코끼리콘'),fmt(dh,'홀드콘')].forEach(x=>{ if(x) seg.push(x); });
        if(seg.length) diffStr=`<span class="bv-cone cone-diff">가감 ${seg.join(' · ')}</span>`;
      }
      if(d||s||diffStr) coneBadge=`<div class="bv-cones">${d}${s}${diffStr}</div>`;
    }
    html+=`<div class="bv-bay"><div class="bv-bayhd">BAY ${bayTitle}</div>
      ${coneBadge}
      <div class="bv-split">`;
    if(hasD) html+=panel('d','양하',cnt.d);
    if(hasL) html+=panel('l','선적',cnt.l);
    html+='</div></div>';
  }
  }  // ConeOne 1.2: 폴백(간이 격자 모드) 분기 닫기
  html+=`</div></div>`;  // bv-zoomarea, bv-zoomwrap 닫기
  html+='</div>';
  ra.innerHTML=html;
  bindResultTabs();
  enterResultMode('bay');

  // 축소 슬라이더 + 가로모드 회전
  const zArea=document.getElementById('bvZoomArea');
  const zRange=document.getElementById('bvZoomRange');
  const zPct=document.getElementById('bvZoomPct');
  const zRotate=document.getElementById('bvRotate');
  const zWrap=document.getElementById('bvZoomWrap');
  let bvRotated=false;
  const applyView=()=>{
    let v=parseInt(zRange.value,10);
    v=Math.max(10,Math.min(100,v));
    zRange.value=v; zPct.textContent=v+'%';
    const s=v/100;
    zArea.style.transformOrigin='top left';
    if(bvRotated){
      // 1) 회전 없는 원래 콘텐츠 크기 측정
      zArea.style.transform='none';
      zArea.style.width='max-content';
      zArea.style.height='';
      const cw=zArea.scrollWidth;   // 원래 가로폭 (베이 01~44 전체)
      const ch=zArea.scrollHeight;  // 원래 세로높이
      // 2) 시계방향 90도 회전. top-left origin 기준 회전 시 콘텐츠가 위로 올라가므로
      //    먼저 translate로 끌어내린 뒤 회전 (transform은 왼→오 순서로 좌표계에 적용)
      //    translateX(ch) 로 오른쪽 복귀 + scale
      zArea.style.transform='translateX('+(ch*s)+'px) rotate(90deg) scale('+s+')';
      // 3) wrap에 회전 결과 높이 부여 → 위 여백 없이 바로 보이고 끝까지 스크롤
      zWrap.style.width='100%';
      zWrap.style.height=(cw*s)+'px';
      zWrap.scrollLeft=0; zWrap.scrollTop=0;
    }else{
      zArea.style.transform='scale('+s+')';
      zArea.style.width=(100/s)+'%';
      zArea.style.height='';
      zWrap.style.height='';
      zWrap.style.width='';
    }
  };
  const applyZoom=(v)=>{ zRange.value=Math.max(10,Math.min(100,v)); applyView(); };
  if(zRange){
    zRange.oninput=()=>applyView();
    document.getElementById('bvZoomOut').onclick=()=>applyZoom(parseInt(zRange.value,10)-10);
    document.getElementById('bvZoomIn').onclick=()=>applyZoom(parseInt(zRange.value,10)+10);
    if(zRotate){
      zRotate.onclick=()=>{
        bvRotated=!bvRotated;
        zRotate.textContent=bvRotated?'⟳ 세로모드':'⟳ 가로모드';
        zRotate.style.background=bvRotated?'var(--accent,#d97706)':'';
        applyView();
      };
    }
    // 핀치(두 손가락) 확대/축소
    let pinchStartDist=0, pinchStartZoom=100;
    const pdist=(t)=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
    zWrap.addEventListener('touchstart',(e)=>{
      if(e.touches.length===2){
        pinchStartDist=pdist(e.touches);
        pinchStartZoom=parseInt(zRange.value,10);
      }
    },{passive:true});
    zWrap.addEventListener('touchmove',(e)=>{
      if(e.touches.length===2 && pinchStartDist>0){
        e.preventDefault();
        const ratio=pdist(e.touches)/pinchStartDist;
        applyZoom(Math.round(pinchStartZoom*ratio));
      }
    },{passive:false});
    zWrap.addEventListener('touchend',(e)=>{
      if(e.touches.length<2) pinchStartDist=0;
    },{passive:true});
    applyZoom(100);
  }
  ra.scrollIntoView({behavior:'smooth',block:'start'});
}

// V7.29: 콘 동선 계산 — 종류별로 회수 베이(diff<0)의 콘을 필요 베이(diff>0)에 매칭.
//   양하 후 선적 흐름이라 회수분이 다 모인 상태에서 분배. 베이 번호 가까운 순으로 매칭.
//   모자라면 콘박스에서 보충, 남으면 콘박스로. (같은 종류끼리만 호환.)
function computeRoutes(rows, kind, per){
  // kind: 'deck'|'ele'|'hold'. per: 곳수(총개수 = diff × per). hold는 diff가 이미 총개수(per=1).
  const tot = r => r[kind].diff * per;  // 총개수 단위 증감
  const supply = rows.filter(r=>tot(r)<0).map(r=>({bay:r.bay, num:parseInt(r.bay,10), left:-tot(r)}));
  const demand = rows.filter(r=>tot(r)>0).map(r=>({bay:r.bay, num:parseInt(r.bay,10), need:tot(r)}));
  // 각 필요 베이에 대해 가장 가까운 회수 베이부터 채움
  const plan = demand.map(d=>{
    const froms=[]; let remain=d.need;
    const order=supply.filter(s=>s.left>0).sort((a,b)=>Math.abs(a.num-d.num)-Math.abs(b.num-d.num));
    for(const s of order){ if(remain<=0) break; const take=Math.min(s.left, remain); if(take>0){ froms.push({bay:s.bay, qty:take}); s.left-=take; remain-=take; } }
    return {bay:d.bay, need:d.need, froms, box:remain>0?remain:0};
  });
  const totalSupply = rows.filter(r=>tot(r)<0).reduce((a,r)=>a-tot(r),0);
  const totalBox = plan.reduce((a,p)=>a+p.box,0);
  const usedFromSupply = totalSupply - supply.reduce((a,s)=>a+(s.left>0?s.left:0),0);
  const leftoverToBox = supply.reduce((a,s)=>a+(s.left>0?s.left:0),0);
  return { plan, totalSupply, usedFromSupply, totalBox, leftoverToBox, hasAny: plan.length>0 || totalSupply>0 };
}

// ===== V7.55 콘 질문기 — "5번 베이 콘?" 한 마디로 작업표 답변 (음성 입출력) =====
//   범위: 베이별 콘 가감(데크/코끼리/홀드)·컨테이너 대수·모자란/남는 베이·전체 요약.
//   콘 작업 중 일일이 눌러보지 않고 폰에 물어보는 용도 (사용자 확정).
// V7.56: STT 항만 용어 교정 (검수앱 voice.js와 동일 — "양하"를 양아/양화로 받아 적는 것 보정)
const CONE_FIX_MAP=[[/양\s*아|양화|향하|얀하/g,'양하'],[/성적/g,'선적'],[/(\d)\s*번\s*배(?![이가])/g,'$1번 베이'],[/배이|배\s*이|베\s*이|뱅이/g,'베이'],[/니퍼|리포(?!트)|리퍼드/g,'리퍼'],[/콘테이너|컨태이너|컨테이나/g,'컨테이너'],[/댁콘|대크콘|덱콘|데크\s+콘/g,'데크콘'],[/코끼리\s+콘/g,'코끼리콘'],[/홀드\s+콘|홀두콘|올드콘/g,'홀드콘'],[/홀두/g,'홀드'],[/갑반/g,'갑판']];
const CONE_DOMAIN_WORDS=['양하','선적','베이','데크콘','코끼리콘','홀드콘','컨테이너','홀드','갑판','몇','남','모자','전체','반납','추가'];
function coneFixSpeech(text){ let t=String(text||''); for(const [re,to] of CONE_FIX_MAP) t=t.replace(re,to); return t; }
function conePickAlt(alts){
  const list=(alts||[]).filter(Boolean);
  if(!list.length) return '';
  let best=coneFixSpeech(list[0]), bestScore=-1;
  for(const a of list){
    const f=coneFixSpeech(a);
    let s=0; for(const w of CONE_DOMAIN_WORDS) if(f.includes(w)) s++;
    if(s>bestScore){ bestScore=s; best=f; }
  }
  return best;
}
function coneSpeak(text){
  try{
    const u=new SpeechSynthesisUtterance(text.replace(/[+\-]/g, m=>m==='+'?' 플러스 ':' 마이너스 '));
    u.lang='ko-KR'; u.rate=1.05;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function coneQaConeLine(name, o, per){
  // o={need, have, diff} (곳당), per=곳 수. 총개수와 행동(추가/반납/그대로)을 사람이 말하듯.
  const totD=o.diff*per;
  if(o.need===0&&o.have===0) return null;
  if(o.diff>0) return name+' 곳당 '+o.have+'에서 '+o.need+'개로, 총 '+totD+'개 더 필요(추가)';
  if(o.diff<0) return name+' 곳당 '+o.have+'에서 '+o.need+'개로, 총 '+(-totD)+'개 남음(반납)';
  return name+' 곳당 '+o.need+'개 그대로';
}
function coneQaAnswer(qRaw){
  const q=(qRaw||'').trim();
  if(!q) return null;
  const rows=(window.__coneQA&&window.__coneQA.rows)||[];
  if(!rows.length) return '먼저 계산하기를 눌러 작업표를 만들어 주세요.';
  const t=q.toLowerCase();
  // 콘 종류 (선택)
  const kind=/데크/.test(t)?'deck':(/코끼리/.test(t)?'ele':(/홀드/.test(t)?'hold':null));
  const kindName={deck:'데크콘',ele:'코끼리콘',hold:'홀드콘'};
  const perOf={deck:4,ele:2,hold:1};
  // 베이 번호 → rows 라벨 매칭 ("06-07" 페어 라벨에 6도 7도 매칭)
  const bayM=t.match(/(\d{1,3})\s*(?:번)?\s*베이|베이\s*(\d{1,3})|^(\d{1,3})$/);
  const bayN=bayM?parseInt(bayM[1]||bayM[2]||bayM[3],10):null;
  // ConeOne 1.1: 트리오 라벨은 구간 매칭 — (구) 끝 숫자만 비교해 "6번 베이"가 "05-07" 행을 못 찾음.
  //   콘 작업자는 트리오를 가운데 짝수 번호로 부른다(C8.34 확정: 33-34-35 = "34번").
  const findRow=(n)=>rows.find(r=>{
    const ns=String(r.bay).split(/[,\-]/).map(p=>parseInt(p,10)).filter(Number.isFinite);
    return ns.length && n>=Math.min.apply(null,ns) && n<=Math.max.apply(null,ns);
  });
  // ① 베이 질문
  if(bayN!=null){
    const r=findRow(bayN);
    if(!r) return bayN+'번 베이는 작업표에 없습니다. (콘 작업 없는 베이)';
    // 컨테이너 대수 질문이면
    if(/컨테이너|몇\s*대|대수/.test(t)){   // 콘은 '개', 컨테이너는 '대' — '몇 개'는 콘 질문이므로 여기 추가 금지(V7.91-02 검증에서 확인)
      // ConeOne 1.1: 트리오 라벨("05-07")은 구간으로 해석 — (구) 끝 숫자(5·7)만 비교해 가운데 짝수 베이(6) 컨테이너가 대수에서 누락
      const cnt=(rows0)=>{
        const ns=String(r.bay).split(/[,\-]/).map(p=>parseInt(p,10)).filter(Number.isFinite);
        if(!ns.length) return 0;
        const lo=Math.min.apply(null,ns), hi=Math.max.apply(null,ns);
        return rows0.filter(c=>{ const b=parseInt(c.bay,10); return b>=lo&&b<=hi; }).length;
      };
      const d=state.disch&&state.disch.ediRows?cnt(state.disch.ediRows):0;
      const l=state.stow&&state.stow.ediRows?cnt(state.stow.ediRows):0;
      return '베이 '+r.bay+'. 양하 '+d+'대, 선적 '+l+'대.';
    }
    const kinds=kind?[kind]:['deck','ele','hold'];
    const lines=kinds.map(k=>coneQaConeLine(kindName[k], r[k], perOf[k])).filter(Boolean);
    if(!lines.length) return '베이 '+r.bay+'. 콘 변동 없습니다.';
    return '베이 '+r.bay+'. '+lines.join('. ')+'.';
  }
  // ② 모자란/남는 베이 목록
  // V7.91-02: 일상 동의어 확장 — 모자란(필요·가져가야)·남는(남았·뺄·빼야·돌려줄)
  if(/모자|부족|추가|필요|가져가야|가져갈/.test(t) || /남(는|아|았|을)|반납|회수|빼\s*야|뺄|돌려/.test(t)){
    const wantAdd=/모자|부족|추가|필요|가져가야|가져갈/.test(t);
    const ks=kind?[kind]:['deck','ele','hold'];
    const out=[];
    for(const r of rows){
      const seg=ks.map(k=>{
        const d=r[k].diff*perOf[k];
        if(wantAdd&&d>0) return kindName[k]+' '+d+'개';
        if(!wantAdd&&d<0) return kindName[k]+' '+(-d)+'개';
        return null;
      }).filter(Boolean);
      if(seg.length) out.push('베이 '+r.bay+': '+seg.join(', '));
    }
    if(!out.length) return wantAdd?'더 필요한 콘이 있는 베이가 없습니다.':'반납할 콘이 있는 베이가 없습니다.';
    return (wantAdd?'콘이 더 필요한 곳 — ':'콘이 남는 곳(반납) — ')+out.join(' / ');
  }
  // ③ 전체 요약
  if(/전체|전부|모두|몽땅|싹\s*다|죄다|도합|통틀어|합쳐|합치|총|요약|다\s*해서|(?:^|\s)다(?=\s|$|[?.!,])/.test(t)){   // V7.91-02: 전부·모두·다 등
    const ks=kind?[kind]:['deck','ele','hold'];
    const seg=ks.map(k=>{
      const tot=rows.reduce((a,r)=>a+r[k].diff*perOf[k],0);
      return kindName[k]+' '+(tot>0?('+'+tot+'개 추가'):tot<0?((-tot)+'개 반납'):'변동 없음');
    });
    return '전체 가감. '+seg.join(', ')+'.';
  }
  // ④ 콘 종류만 ("데크콘") → 전체 그 종류 요약
  if(kind){
    const tot=rows.reduce((a,r)=>a+r[kind].diff*perOf[kind],0);
    const list=rows.filter(r=>r[kind].diff!==0).map(r=>'베이 '+r.bay+' '+(r[kind].diff>0?'+':'')+(r[kind].diff*perOf[kind])+'개').join(', ');
    return kindName[kind]+' 전체 '+(tot>0?('+'+tot+'개 추가'):tot<0?((-tot)+'개 반납'):'변동 없음')+(list?('. '+list):'')+'.';
  }

}
// V7.91: 음성 질문 자동 복원 — 검수앱 V7.80과 동일 원칙 이식.

const CONE_GEMINI_KEY='AIzaSyDPRM3bRGusAwhyhjGGka2K1m2r6c5gJKY';
function coneGeminiUrl(){

async function coneFixQuestionWithAI(rawText, timeoutMs){
  const prompt='다음은 항만 컨테이너 고정장치(콘) 작업 현장에서 음성인식으로 받아 적은 질문이다. 음성 오인식을 교정해 의도된 질문을 한국어 한 문장으로만 출력하라. 설명·따옴표 금지.\n현장 용어: 베이, 데크콘, 코끼리콘, 홀드콘, 콘, 컨테이너, 갑판, 홀드, 모자란, 남는, 반납, 추가, 전체, 몇 대, 몇 개.\n예시: "5번 배 대코콘 며개" → 5번 베이 데크콘 몇 개 / "홀두콘 모지란데" → 홀드콘 모자란 데 / "코끼리꼰 남는대" → 코끼리콘 남는 데\n\n받아 적은 질문: "'+rawText+'"';
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(), timeoutMs||4000);
  try{
    const res=await fetch(coneGeminiUrl(),{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0,maxOutputTokens:60}})});
    if(!res.ok) return null;
    const j=await res.json();
    const out=((((((j||{}).candidates||[])[0]||{}).content||{}).parts||[])[0]||{}).text;
    const line=String(out||'').trim().replace(/^["'「]|["'」]$/g,'').split('\n')[0].trim();
    return line&&line.length>=2&&line.length<=60?line:null;
  }catch(e){ return null; }
  finally{ clearTimeout(timer); }
}
// 콘 질문기가 아는 어휘 + 조사·의문어 — 이걸 지우고도 한글 2자+ 토큰이 남으면 "미해석 단어"로 복원 대상.
//   (검수앱 교훈: 완전 실패만 잡으면 "5번 베이 잇퍼"가 베이만 잡혀 엉뚱한 답이 나감 — 부분 인식도 복원.)
const CONE_QA_KNOWN=/데크콘|코끼리콘|홀드콘|컨테이너|베이|데크|코끼리|홀드|갑판|선창|양하|선적|모자|부족|추가|필요|가져|남는|남았|남아|남을|반납|회수|빼야|뺄|돌려|전체|전부|모두|몽땅|싹|죄다|도합|통틀어|합쳐|합치|대수|개수|수량|요약|콘|총|몇|대|개|번|은|는|이|가|을|를|에서|에|의|와|과|도|만|좀|요|줘|주세요|해|야|니|나요|입니까|있|없|어디|뭐|얼마|다/g;
function coneQaLeftover(q){
  return String(q||'').replace(/[0-9A-Za-z\s.,?!]/g,' ').replace(CONE_QA_KNOWN,' ').trim()
    .split(/\s+/).filter(function(t){return t.length>=2;});
}
function bindConeQa(){
  const inp=document.getElementById('cqaInput'), btn=document.getElementById('cqaBtn'), mic=document.getElementById('cqaMic'), out=document.getElementById('cqaOut');
  if(!inp||!btn) return;
  const show=(a)=>{
    if(!a) return;
    out.style.display='block';
    out.textContent=a;
    coneSpeak(a);
  };
  const run=()=>show(coneQaAnswer(inp.value));
  btn.onclick=run;
  inp.onkeydown=(e)=>{ if(e.key==='Enter') run(); };
  if(mic){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ mic.style.display='none'; }
    else{
      let fixTried='';   // V7.91: 같은 문장 1회만 복원
      mic.onclick=()=>{
        const r=new SR(); r.lang='ko-KR'; r.interimResults=false; r.maxAlternatives=5;
        mic.textContent='🎙'; mic.classList.add('on');
        r.onresult=async (e)=>{
          const res=e.results[0];
          const alts=[]; for(let i=0;i<res.length;i++) alts.push(res[i].transcript);
          inp.value=conePickAlt(alts);
          // V7.91: 음성 한정 자동 복원 — 못 알아들었거나(도움말) 미해석 단어가 남으면
          //   AI로 질문 1회 복원 후 재시도. 실패·오프라인이면 조용히 원래 답.
          const q=inp.value.trim();
          const a=coneQaAnswer(q);
          const canFix=q.length>=4&&!/^[0-9\s]+$/.test(q)&&fixTried!==q
            &&(a===CONE_QA_HELP||coneQaLeftover(q).length>0);
          if(!canFix){ show(a); return; }
          fixTried=q;
          out.style.display='block'; out.textContent='🎙 문장 복원 중…';
          const fixed=await coneFixQuestionWithAI(q);
          if(fixed&&fixed!==q){
            const a2=coneQaAnswer(fixed);
            if(a2&&a2!==CONE_QA_HELP){ inp.value=fixed; show(a2); return; }
          }
          show(a);
        };
        r.onend=()=>{ mic.textContent='🎤'; mic.classList.remove('on'); };
        r.onerror=()=>{ mic.textContent='🎤'; mic.classList.remove('on'); };
        try{ r.start(); }catch(_){}
      };
    }
  }
}

// perCount: 곳수 (데크콘 4곳, 코끼리콘 2곳, 홀드콘 1곳=중간). 총개수 = 곳당 × 곳수.
function cell(c, perCount, subTxt){
  if(c.need===0&&c.have===0) return '<td class="keep-c">·</td>';
  let cls,txt;
  if(c.diff>0){cls='add';txt='+'+c.diff;}
  else if(c.diff<0){cls='rem';txt='−'+(-c.diff);}
  else {cls='keep';txt='0';}
  // 총개수: 곳당 diff × 곳수 (추가/반납 총량)
  const totalDiff = c.diff * (perCount||1);
  const totalTxt = totalDiff>0?`총 +${totalDiff}개`:totalDiff<0?`총 −${-totalDiff}개`:'';
  // V8.34: 필요 강조 + 소그룹(홀수·짝수) 분해를 작게 병기 — 예: 33:2 · 34-35:26
  return `<td class="${cls}-c"><span class="big">${txt}</span>${totalTxt?`<span class="total">${totalTxt}</span>`:''}<span class="sub">회수${c.have}→<b class="need-hl">필요${c.need}</b></span>${subTxt?`<span class="sub sub2">${subTxt}</span>`:''}</td>`;
}

function copyText(rows,ship,today){
  let t=`[콘 작업표] ${ship} ${today}\n`;
  t+=`(콘: 데크/코끼리/홀드, +추가 −반납, 곳당 → 총개수)\n`;
  for(const r of rows){
    const f=(c,per)=>{
      if(c.diff===0) return '0';
      const sign=c.diff>0?'+':'−', v=Math.abs(c.diff), tot=v*per;
      return `${sign}${v}(총${sign}${tot})`;
    };
    t+=`${r.bay}번: 데크${f(r.deck,4)} 코끼리${f(r.ele,2)} 홀드${f(r.hold,1)}\n`;
  }
  navigator.clipboard.writeText(t).then(()=>alert('복사됐습니다. 카톡에 붙여넣으세요.'),
    ()=>{ prompt('아래를 복사하세요:',t); });
}

function saveImage(rows,ship,today){

  const H=headH + rows.length*rowH + foot;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d');
  x.fillStyle='#ffffff'; x.fillRect(0,0,W,H);
  // 헤더
  x.fillStyle='#0f1419'; x.font='bold 26px sans-serif';
  x.fillText('콘 작업표', 24, 40);
  x.fillStyle='#555'; x.font='15px sans-serif';
  x.fillText(`${ship} · ${today} · ${state.shipType==='container'?'컨테이너선':'일반/복합선'}`, 24, 66);
  // 열 헤더
  const cols=[ {t:'베이',x:24,w:90}, {t:'데크콘',x:130,w:190}, {t:'코끼리콘',x:330,w:190}, {t:'홀드콘',x:530,w:170} ];
  x.fillStyle='#e8a000'; x.fillRect(0,headH-34,W,34);
  x.fillStyle='#1a1206'; x.font='bold 16px sans-serif';
  cols.forEach(c=>x.fillText(c.t, c.x+8, headH-12));
  // 행
  let y=headH;
  rows.forEach((r,i)=>{
    x.fillStyle = i%2? '#f4f7fa':'#ffffff'; x.fillRect(0,y,W,rowH);
    x.fillStyle='#0f1419'; x.font='bold 22px sans-serif';
    x.fillText(r.bay+'번', 32, y+38);
    drawCell(x, r.deck, 130, y, rowH, 4);
    drawCell(x, r.ele, 330, y, rowH, 2);
    drawCell(x, r.hold, 530, y, rowH, 1);
    x.strokeStyle='#dde3ea'; x.beginPath(); x.moveTo(0,y+rowH); x.lineTo(W,y+rowH); x.stroke();
    y+=rowH;
  });
  x.fillStyle='#888'; x.font='13px sans-serif';
  x.fillText('+추가  −반납  ·그대로  (큰=곳당, 총=총개수)  |  콘 작업 전 반드시 확인', 24, y+26);
  // 다운로드
  const url=cv.toDataURL('image/png');
  const a=document.createElement('a');
  a.href=url; a.download=`콘작업표_${ship}_${today}.png`.replace(/[\\/:*?"<>|]/g,'_');
  a.click();
}
function drawCell(x,c,cx,y,rowH,perCount){
  if(c.need===0&&c.have===0){ x.fillStyle='#bbb'; x.font='20px sans-serif'; x.fillText('·',cx+8,y+38); return; }
  let col, txt;
  if(c.diff>0){col='#1a9c5b'; txt='+'+c.diff;}
  else if(c.diff<0){col='#d83a3a'; txt='−'+(-c.diff);}
  else {col='#888'; txt='0';}
  x.fillStyle=col; x.font='bold 23px sans-serif'; x.fillText(txt, cx+8, y+26);
  // 총개수 (곳당 × 곳수)
  const per=perCount||1, tot=c.diff*per;
  if(tot!==0){ x.fillStyle=col; x.font='bold 15px sans-serif'; x.fillText(`총 ${tot>0?'+':'−'}${Math.abs(tot)}개`, cx+8, y+44); }
  x.fillStyle='#999'; x.font='12px sans-serif'; x.fillText(`${c.have}→${c.need}`, cx+8, y+58);
}

try{ render(); loadVoyageList(); }catch(e){

// 콘앱 불편신고 — 신고를 Firebase feedback에 저장(약신호면 localStorage 큐 후 자동 재전송), 처리는 개발 세션의 Claude가 조회.
(function(){
  var FB='https://greenmarinetally-default-rtdb.asia-southeast1.firebasedatabase.app';
  var QK='gm_cone_feedback_queue';
  function flush(){
    var q; try{ q=JSON.parse(localStorage.getItem(QK)||'[]'); }catch(e){ q=[]; }
    if(!q.length) return;
    (function(it){ var ts=it.ts||it.at||Date.now();
      // V9.36-02: 검수앱과 같은 형식(키=ts, ts·resolved 포함) — POST 푸시키는 대시보드에서 유령 레코드가 됐다.
      return fetch(FB+'/feedback/'+ts+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({ts:ts,resolved:false},it))});})(q[0])
      .then(function(r){ if(r.ok){ q.shift(); localStorage.setItem(QK,JSON.stringify(q)); if(q.length) flush(); } })
      .catch(function(){});
  }
  function submit(txt){
    txt=(txt||'').trim(); if(!txt) return false;
    var it={ text: txt.slice(0,2000), at: Date.now(),
      atText: new Date().toLocaleString('ko-KR'),
      app:'cone', ver:(window.__CONEV||'')+' ('+(window.__APPV||'')+')',   // ConeOne 1.1: 고정 문자열(V8.45-02) 대신 실제 버전
      ua: navigator.userAgent.slice(0,90), status:'new' };
    var q; try{ q=JSON.parse(localStorage.getItem(QK)||'[]'); }catch(e){ q=[]; }
    q.push(it); localStorage.setItem(QK,JSON.stringify(q)); flush();
    return true;
  }
  var btn=document.createElement('button');
  btn.textContent='🔧 불편신고';
  btn.setAttribute('style','position:fixed;left:10px;bottom:10px;z-index:9999;background:#334155;color:#e2e8f0;border:1px solid #475569;border-radius:8px;padding:6px 10px;font-size:12px;opacity:.85');
  btn.onclick=function(){
    var ov=document.createElement('div');
    ov.setAttribute('style','position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px');
    ov.innerHTML='<div style="background:#1e293b;border:1px solid #475569;border-radius:12px;padding:14px;width:100%;max-width:420px">'
      +'<div style="color:#e2e8f0;font-weight:700;margin-bottom:8px">불편·오류 신고</div>'
      +'<div style="color:#94a3b8;font-size:12px;margin-bottom:8px">틀린 계산, 불편한 점을 적어 주세요. 신호가 없어도 저장됐다가 자동 전송됩니다.</div>'
      +'<textarea id="gmFbTxt" rows="5" style="width:100%;box-sizing:border-box;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:8px;padding:8px;font-size:14px"></textarea>'
      +'<div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">'
      +'<button id="gmFbCancel" style="background:#334155;color:#cbd5e1;border:0;border-radius:8px;padding:8px 14px">닫기</button>'
      +'<button id="gmFbSend" style="background:#2563eb;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700">보내기</button>'
      +'</div></div>';
    document.body.appendChild(ov);
    ov.querySelector('#gmFbCancel').onclick=function(){ ov.remove(); };
    ov.querySelector('#gmFbSend').onclick=function(){
      if(submit(ov.querySelector('#gmFbTxt').value)){ ov.remove(); alert('접수됐습니다. 개발 점검 때 반영됩니다.'); }
    };
  };
  document.body.appendChild(btn);
  window.addEventListener('online',flush);
  flush();
})();

// 콘앱 자동 업데이트 감지 + 강제 새로고침 — 배포된 __CONEV와 비교해 새 버전이면 상단 배너. 배너/버튼 탭 시 서비스워커·캐시 비우고 최신본 재로드.
(function(){
  var RUN = window.__CONEV || '';
  var _last = 0, _shown = false;
  async function hardRefresh(){
    try{ if(navigator.serviceWorker){ var rs=await navigator.serviceWorker.getRegistrations(); for(var i=0;i<rs.length;i++){ await rs[i].unregister(); } } }catch(e){}
    try{ if(window.caches){ var ks=await caches.keys(); for(var j=0;j<ks.length;j++){ await caches.delete(ks[j]); } } }catch(e){}
    location.replace(location.pathname + '?u=' + Date.now());
  }
  function showBanner(latest){
    if(_shown) return; _shown = true;
    var bar=document.createElement('div');
    bar.setAttribute('style','position:fixed;left:0;right:0;top:0;z-index:10001;background:#2563eb;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3)');
    var sp=document.createElement('span'); sp.textContent='새 버전('+latest+')이 있습니다.';
    var b=document.createElement('button'); b.textContent='지금 업데이트';
    b.setAttribute('style','background:#fff;color:#2563eb;border:0;border-radius:8px;padding:6px 14px;font-weight:700');
    b.onclick=hardRefresh;
    bar.appendChild(sp); bar.appendChild(b); document.body.appendChild(bar);
  }
  async function checkUpdate(){
    var now=Date.now(); if(now-_last < 90000) return; _last=now;
    try{
      var res=await fetch(location.pathname + '?_ck=' + now, {cache:'no-store'});
      if(!res.ok) return;
      var txt=await res.text();
      var m=txt.match(/__CONEV\s*=\s*'([^']+)'/);
      var latest=m?m[1]:'';
      if(latest && RUN && latest!==RUN) showBanner(latest);
    }catch(e){}
  }
  var rb=document.createElement('button');
  rb.textContent='🔄 새로고침';
  rb.setAttribute('style','position:fixed;left:10px;bottom:46px;z-index:9999;background:#334155;color:#e2e8f0;border:1px solid #475569;border-radius:8px;padding:6px 10px;font-size:12px;opacity:.85');
  rb.onclick=function(){ if(confirm('최신 버전으로 새로고침할까요? 보던 결과는 사라집니다.')) hardRefresh(); };
  document.body.appendChild(rb);
  setTimeout(checkUpdate, 1500);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkUpdate(); });
})();
</script>
